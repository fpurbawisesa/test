<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // 1. Make window.fetch writable if it only has a getter in the sandbox
        try {
          var origFetch = window.fetch;
          var curFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return curFetch; },
            set: function(fn) { curFetch = fn; }
          });
        } catch (e) {}

        // 2. Prevent extension errors (chrome-extension://, ethereum, fetch) from bubbling
        window.addEventListener('error', function(event) {
          var msg = event.message ? String(event.message) : '';
          var file = event.filename ? String(event.filename) : '';
          if (
            file.indexOf('chrome-extension://') !== -1 ||
            file.indexOf('moz-extension://') !== -1 ||
            msg.indexOf('ethereum') !== -1 ||
            msg.indexOf('Cannot redefine property') !== -1 ||
            msg.indexOf('fetch of #<Window>') !== -1 ||
            msg.indexOf('read only property \'fetch\'') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = event.reason ? String(event.reason) : '';
          if (
            reasonStr.indexOf('ethereum') !== -1 ||
            reasonStr.indexOf('chrome-extension://') !== -1 ||
            reasonStr.indexOf('fetch') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
